name: CI/CD Security & Quality Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: your-org/your-app
  DOCKER_TAG: ${{ github.sha }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  CHECKMARX_SERVER: ${{ secrets.CHECKMARX_SERVER }}
  CHECKMARX_USER: ${{ secrets.CHECKMARX_USER }}
  CHECKMARX_PASSWORD: ${{ secrets.CHECKMARX_PASSWORD }}

jobs:

  # ------------------------
  # Code Quality and SAST
  # ------------------------
  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # -------------------
      # SonarQube Scan
      # -------------------
      - name: Set up SonarQube Scanner
        uses: sonarsource/sonarcloud-github-action@master

      - name: Run SonarQube Scan
        run: |
          sonar-scanner \
            -Dsonar.projectKey=your-project \
            -Dsonar.organization=your-org \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }}

      # -------------------
      # Checkmarx SAST Scan
      # -------------------
      - name: Install Checkmarx CLI
        run: |
          curl -LO https://download.checkmarx.com/cli/cx-cli.zip
          unzip cx-cli.zip -d cx-cli
          chmod +x cx-cli/cx

      - name: Run Checkmarx Scan
        run: |
          ./cx-cli/cx scan create \
            --project-name "your-project" \
            --sast-server "${{ env.CHECKMARX_SERVER }}" \
            --username "${{ env.CHECKMARX_USER }}" \
            --password "${{ env.CHECKMARX_PASSWORD }}" \
            --source ./ \
            --preset "Default"

  # ------------------------
  # Container Build & Scan
  # ------------------------
  container-security:
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} .

      - name: Trivy Scan for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          format: table
          exit-code: 1  # Fail workflow if vulnerabilities found
          ignore-unfixed: false
